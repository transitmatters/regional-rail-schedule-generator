[project]
name = "regional-rail-schedule-generator"
version = "0.1.0"
description = "Generate a new GTFS schedule bundle for a proposed new MBTA service"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "requests~=2.32.3",
    "numpy~=2.3.4",
    "cvxpy~=1.7.3",
    "frozendict~=2.4.6",
    "click~=8.1.8",
    "tqdm~=4.67.1",
    "pandas~=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest~=8.4.0",
    "pre-commit>=4.3.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
